
name: Student Registration CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t student-registration:${{ github.sha }} .

  cd:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to EC2 and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          # Check required secrets
          test -n "$EC2_HOST" || {
            echo "EC2_HOST secret is empty"
            exit 1
          }

          test -n "$EC2_USER" || {
            echo "EC2_USER secret is empty"
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "EC2_SSH_KEY secret is empty"
            exit 1
          }

          # Configure SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Connect to EC2 and deploy
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'

          set -eu

          # Correct EC2 project directory
          cd /home/ec2-user/CI-CD-project

          # Pull latest code
          git pull --ff-only origin main

          # Build Docker image
          docker build -t student-registration:latest .

          # Remove previous container if it exists
          docker rm -f student-app 2>/dev/null || true

          # Start the updated application
          docker run -d \
            --restart unless-stopped \
            --name student-app \
            -p 5000:5000 \
            student-registration:latest

          # Verify application health
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo "Deployment successful"
              exit 0
            fi

            sleep 2
          done

          echo "Health check failed"
          docker logs student-app
          exit 1

          REMOTE
      - name: port change
        run: docker run -d --name=demoji -p 8080:5000 student-registration:latest
